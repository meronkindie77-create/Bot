<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      padding-bottom: 70px;
    }

    /* Top Balance Card */
    .balance-card {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      margin: 15px;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }
    .balance-card h1 { margin: 5px 0; font-size: 32px; }

    /* Task Card */
    .task-card {
      background: #161b22;
      margin: 15px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #30363d;
    }
    .task-buttons { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-open { background: #22c55e; color: #fff; }
    .btn-claim { background: #3b82f6; color: #fff; }

    /* Bottom Navigation Bar */
    .navbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #161b22;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #30363d;
    }
    .nav-item {
      color: #8b949e;
      text-decoration: none;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }
    .nav-item.active { color: #38bdf8; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- Home Tab -->
  <div id="tab-home" class="tab-content active">
    <div class="balance-card">
      <p style="margin:0; opacity:0.8;">Total Balance</p>
      <h1>2,250 ETB</h1>
    </div>

    <div class="task-card">
      <h3>Join WhatsApp Channel</h3>
      <p style="color:#a3a3a3; font-size:14px;">+100 ETB Reward</p>
      <div class="task-buttons">
        <button class="btn btn-open" onclick="window.open('https://whatsapp.com', '_blank')">Open</button>
        <button class="btn btn-claim" onclick="claimReward()">Claim</button>
      </div>
    </div>
  </div>

  <!-- Earn Tab -->
  <div id="tab-earn" class="tab-content">
    <h2 style="padding: 15px;">Earn Tasks</h2>
    <p style="padding: 0 15px;">More tasks coming soon...</p>
  </div>

  <!-- Withdraw Tab -->
  <div id="tab-withdraw" class="tab-content">
    <h2 style="padding: 15px;">Withdrawal</h2>
    <p style="padding: 0 15px;">Enter your Telebirr / CBE number to withdraw.</p>
  </div>

  <!-- Bottom Nav -->
  <div class="navbar">
    <div class="nav-item active" onclick="switchTab('home', this)">Home</div>
    <div class="nav-item" onclick="switchTab('earn', this)">Earn</div>
    <div class="nav-item" onclick="switchTab('withdraw', this)">Withdraw</div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    function switchTab(tabName, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

      document.getElementById('tab-' + tabName).classList.add('active');
      element.classList.add('active');
    }

    function claimReward() {
      tg.showAlert("Task completed! Balance updated.");
    }
  </script>
</body>
</html>
